<!doctype html><html lang="pt-BR" data-theme="dark"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plural v0.4.17</title><style>
:root{--bg:#0a0a0a;--card:#151515;--text:#f0f0f0;--gold:#d4af37;--border:#444;--input:#222;--accent:#3e2723}html[data-theme=light]{--bg:#f4eed8;--card:#ede5c8;--text:#1e0f02;--gold:#7a5c10;--border:#c8aa6a;--input:#e8dfc0;--accent:#ddd5b8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Arial,sans-serif}header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--card);border-bottom:1px solid var(--border)}h1{margin:0;font-size:17px;color:var(--gold)}button,select,input{min-height:36px;padding:5px 8px;border:1px solid var(--border);border-radius:5px;background:var(--input);color:var(--text)}button{cursor:pointer}.charbar{position:sticky;top:49px;z-index:19;display:flex;gap:4px;overflow:auto;padding:5px 8px;background:var(--card)}.charbar button{flex-shrink:0}.active{background:var(--accent);border-color:var(--gold)}main{max-width:1450px;margin:auto;padding:8px}.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1}.panel{border:1px solid var(--border);border-radius:7px;overflow:hidden;margin-bottom:8px;background:var(--card)}.title,summary{padding:10px;background:var(--accent);color:var(--gold);font-weight:bold;cursor:pointer}.title{cursor:default}.summary{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;padding:8px}.cell{padding:6px 2px;border:1px solid var(--border);border-radius:5px;text-align:center}.cell b{display:block;font-size:11px;margin-bottom:4px}.cell strong{font-size:18px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--border);overflow-wrap:anywhere}.row>span{min-width:0}.row>span:last-child{text-align:right}.row select{max-width:145px}.dodge{padding:10px;border-top:1px solid var(--border)}.help{font-size:12px;line-height:1.5;padding:7px 10px;margin:0;white-space:pre-line}details{border-top:1px solid var(--border)}summary small{float:right}.scroll{overflow:auto;max-height:70dvh}table{border-spacing:0;width:100%;font-size:13px}th,td{padding:7px 8px;border-bottom:1px solid var(--border);border-right:1px solid var(--border);background:var(--card);text-align:center;vertical-align:top;overflow-wrap:anywhere}thead th{color:var(--gold)}th:first-child{text-align:left}footer{padding:12px;text-align:center;font-size:11px}[hidden]{display:none!important}@media(max-width:550px){.summary{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style><header><h1>Plural <small>v0.4.17</small></h1><button id="import" aria-label="Importar fichas">📥</button><button id="save" aria-label="Salvar mesa">💾</button><button id="theme" aria-label="Alternar tema">🌓</button></header><div id="charbar" class="charbar"></div><main><input id="files" type="file" multiple accept=".json,.gcs,.txt,.plural" hidden><p id="notice" class="help" role="status"></p><nav class="tabs"><button id="tabSheet" class="active">Ficha</button><button id="tabCompare">Comparar</button></nav><section id="sheetView"><div id="sheet"></div></section><section id="compareView" hidden><div class="panel"><div class="title">Comparação <span id="cmpCount"></span></div><div style="padding:8px"><input id="query" type="search" placeholder="Buscar em todas as seções…" style="width:100%"></div><div id="comparison" class="scroll"></div></div></section><details class="panel"><summary>Diagnóstico e armazenamento</summary><p id="storage" class="help"></p><button id="clear" style="margin:10px">Esvaziar mesa</button></details></main><footer>Offline • Sem servidor • Vários personagens</footer><script>
const $=x=>document.getElementById(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),ar=x=>Array.isArray(x)?x:[],flat=xs=>ar(xs).flatMap(x=>[x,...flat(x.children)]),num=x=>typeof x==='number'&&Number.isFinite(x)?x:null;
const labels={st:'ST',dx:'DX',iq:'IQ',ht:'HT',per:'PER',will:'VONT',hp:'PV',fp:'PF'},colors=['#e6b84c','#7ec8a0','#a08cec','#e88b6a','#6ac1e8','#d97fb0','#b8d16a','#e8d06a','#8fd0c8'];
function text(e){if(!e)return null;const c=e.cloneNode(true);c.querySelectorAll('button,script,style').forEach(x=>x.remove());return c.textContent.trim()}
function get(d,q){const e=d.querySelector(q);return e?(e.getAttribute('value')??text(e)):null}
function classify(x){const p=num(x.points),cats=ar(x.categories).map(x=>String(x).toLowerCase());return p===-1||cats.includes('peculiaridade')?'peculiarities':p!=null&&p<0||cats.includes('desvantagem')?'disadvantages':'advantages'}
function weight(w){if(w==null)return 0;if(typeof w==='number')return w;const m=String(w).match(/([\d.,]+)\s*(lb|kg)?/i);if(!m)return 0;const v=parseFloat(m[1].replace(',','.'));return (v||0)*((m[2]||'').toLowerCase()==='kg'?2.20462:1)}
function parseSheet(raw,file,original,state={}){
const c={id:'p'+Date.now().toString(36)+Math.random().toString(36).slice(2),file,original:original??JSON.stringify(raw),name:'',format:'',attrs:{},skills:[],spells:[],advantages:[],disadvantages:[],peculiarities:[],gear:[],attacks:[],warnings:[],dodge:{current:null,total:null,byEncumbrance:null,auto:null,bl:null,carried:0,level:null},state:{encumbrance:'auto',dodgeOverride:null}};
if(typeof raw.sHTML==='string'){
c.format='Singular JSON';c.name=raw.charName||file;const t=document.createElement('template');t.innerHTML=raw.sHTML;const d=t.content;
for(const[k,q]of Object.entries({st:'#st-val',dx:'#dx-val',iq:'#iq-val',ht:'#ht-val',per:'#per-val',will:'#will-val'}))c.attrs[k]=get(d,q);
for(const k of['hp','fp']){const a=get(d,'#'+k+'-cur'),b=get(d,'#'+k+'-max');c.attrs[k]=a!=null||b!=null?`${a??'—'} / ${b??'—'}`:null}
c.dodge.current=get(d,'#esq-cur');c.dodge.total=get(d,'#esq-tot');
const blTxt=get(d,'#bl-display');if(blTxt!=null)c.dodge.bl=weight(blTxt+' kg');
const esq=[];for(const tr of d.querySelectorAll('#load-table tr')){const tds=Array.from(tr.children).filter(x=>x.tagName==='TD');if(tds.length>=4){const v=parseFloat(String(tds[3].textContent).replace(',','.'));if(Number.isFinite(v))esq.push(v)}}
if(esq.length)c.dodge.byEncumbrance=esq.slice(0,5);
const rows=id=>Array.from(d.querySelectorAll('#'+id+' .item-list-row')).map(e=>({name:text(e.querySelector('[contenteditable]'))||'',value:get(e,'.nh-val'),points:get(e,'.pts-input')}));c.skills=rows('skill-list');c.spells=rows('spell-list');
for(const e of d.querySelectorAll('#advantage-list .item-list-row,#disadvantage-list .item-list-row,#trait-list .item-list-row')){const x={name:text(e.querySelector('[contenteditable]'))||'',value:get(e,'.trait-lvl')??e.dataset.habLvl??null,points:get(e,'.pts-input')};c[classify(x)].push(x)}
for(const r of d.querySelectorAll('#inv-list tr')){const cells=Array.from(r.children).filter(x=>x.tagName==='TD'),qty=cells.find(td=>Array.from(td.children).some(x=>x.matches('input.input-qty')));if(!qty)continue;const edit=cells.filter(x=>x.hasAttribute('contenteditable')),n=text(edit[0]);if(n)c.gear.push({name:n,value:get(qty,'.input-qty'),weight:text(edit[1]),state:'carried'})}
for(const id of['melee-list','ranged-list'])for(const r of d.querySelectorAll('#'+id+' tr')){const e=Array.from(r.children).filter(x=>x.tagName==='TD'&&x.hasAttribute('contenteditable')),n=text(e[0]);if(n)c.attacks.push({name:n,value:text(e[1]),detail:text(e[2])||''})}
}else if(Array.isArray(raw.attributes)&&(raw.profile||raw.type==='character')){
c.format='GCS';c.name=raw.profile?.name||file;
for(const a of raw.attributes){const k=a.attr_id||a.id;if(!k)continue;const max=a.calc?.value??a.value??null;let cur=a.calc?.current??null;if(cur==null&&typeof max==='number'&&typeof a.damage==='number')cur=max-a.damage;c.attrs[k]=['hp','fp'].includes(k)?`${cur??'—'} / ${max??'—'}`:max}
const calc=raw.calc||{},v=calc.dodge;if(Array.isArray(v))c.dodge.byEncumbrance=Array.from({length:5},(_,i)=>num(v[i]));c.dodge.bl=weight(calc.basic_lift);let carried=0;
for(const e of flat(raw.equipment)){const st=e.equipped===true?'equipped':e.carried===true?'carried':'none';c.gear.push({name:e.description||e.name||'',value:e.quantity??null,weight:e.weight??null,state:st});if(st!=='none')carried+=weight(e.calc?.extended_weight??e.weight)*(num(e.quantity)||1)}
c.dodge.carried=carried;
const rows=xs=>flat(xs).filter(x=>x.name&&!String(x.type||'').includes('container')).map(x=>({name:x.name,value:x.calc?.level??(typeof x.level==='number'?x.level:null),points:x.calc?.points??x.points??null,categories:x.categories||[]}));c.skills=rows(raw.skills);c.spells=rows(raw.spells);
for(const x of flat(raw.traits||raw.advantages).filter(x=>x.name&&!String(x.type||'').includes('container')).map(x=>({name:x.name,value:x.levels??null,points:x.calc?.points??x.points??null,categories:x.categories||[]})))c[classify(x)].push(x);
for(const o of[...flat(raw.traits||raw.advantages),...flat(raw.equipment)])for(const w of ar(o.weapons))c.attacks.push({name:o.description||o.name||'(ataque)',value:w.calc?.damage??null,detail:[w.calc?.level!=null?'NH '+w.calc.level:null,w.reach||w.calc?.range||w.range].filter(Boolean).join(' · ')});
}else throw Error('Estrutura não reconhecida');
recalcDodge(c);return c}
function recalcDodge(c){
let carried=0;for(const g of c.gear)if(g.state!=='none')carried+=weight(g.weight)*(num(g.value)||1);
c.dodge.carried=carried;
if(c.dodge.bl>0){const bl=c.dodge.bl,lvl=carried>6*bl?4:carried>3*bl?3:carried>2*bl?2:carried>1*bl?1:0;c.dodge.level=lvl;c.dodge.auto=c.dodge.byEncumbrance?.[lvl]??null}
else if(c.dodge.current!=null)c.dodge.auto=c.dodge.current}
function attr(c,k){if(k==='dodge_auto')return c.dodge.auto??c.dodge.current??null;if(k==='dodge_forced')return c.state.dodgeOverride!=null?(c.dodge.byEncumbrance?.[Number(c.state.dodgeOverride)]??c.state.dodgeOverride):null;if(k==='dodge_selected')return c.state.dodgeOverride!=null?attr(c,'dodge_forced'):attr(c,'dodge_auto');return c.attrs[k]??null}
let chars=[],active=0,db=null;
function serial(){return chars.map(c=>({file:c.file,original:c.original,state:{...c.state},gear:c.gear.map(g=>({name:g.name,state:g.state}))}))}
function saveLocal(){if(!db)return;const tx=db.transaction('mesa','readwrite');tx.objectStore('mesa').put(serial(),'current');tx.oncomplete=()=>$('storage').textContent='Recuperação local atualizada.'}
function download(s,name){const u=URL.createObjectURL(new Blob([s],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
async function importFiles(files){let n=0;const fails=[];for(const f of files){try{const original=await f.text(),raw=JSON.parse(original.replace(/^\uFEFF/,''));const batch=['plural-mesa','plural-mobile','plural-session'].includes(raw.formato)&&Array.isArray(raw.fichas)?raw.fichas.map(x=>parseSheet(x.raw??JSON.parse((x.original??x.text??JSON.stringify(x.raw)).replace(/^\uFEFF/,'')),x.file||x.fileName||'ficha.json',x.original??x.text??JSON.stringify(x.raw),x.state||{})):[parseSheet(raw,f.name,original)];chars.push(...batch);n+=batch.length}catch(e){fails.push(f.name+': '+e.message)}}if(chars.length&&!chars[active])active=0;render();saveLocal();$('notice').textContent=n+' ficha(s) adicionada(s).'+(fails.length?'\nFalhas: '+fails.join('\n'):'');$('files').value=''}
const section=(title,body,count,open=false)=>'<details'+(open?' open':'')+'><summary>'+title+' <small>'+count+'</small></summary>'+body+'</details>';
function rows(xs){return xs.length?xs.map(x=>'<div class="row"><span>'+esc(x.name)+'</span><span>'+esc(x.value??'—')+(x.points!=null?' <small>['+esc(x.points)+' pts]</small>':'')+(x.weight?' <small>'+esc(x.weight)+'</small>':'')+(x.detail?' <small>'+esc(x.detail)+'</small>':'')+'</span></div>').join(''):'<p class="help">Nenhum registro.</p>'}
function renderSheet(c){const gear=c.gear.map((g,i)=>'<div class="row"><span>'+esc(g.name)+'</span><span><select data-eq="'+c.id+'" data-i="'+i+'">'+['none','carried','equipped'].map(v=>'<option value="'+v+'" '+(g.state===v?'selected':'')+'>'+({none:'Não carregado',carried:'Carregado',equipped:'Equipado'}[v])+'</option>').join('')+'</select> <small>'+esc(g.weight??'—')+(num(g.value)&&num(g.value)>1?' × '+g.value:'')+'</small></span></div>').join('');
const dodge='<div class="dodge"><b>Esquiva</b><p><label>Nível de carga <select data-load="'+c.id+'">'+['auto','0','1','2','3','4'].map(v=>'<option value="'+v+'" '+((c.state.dodgeOverride==null&&v==='auto')||String(c.state.dodgeOverride)===v?'selected':'')+'>'+(v==='auto'?'Automático':'Carga '+v)+'</option>').join('')+'</select></label></p><p class="help">Automática: <b>'+esc(attr(c,'dodge_auto')??'—')+'</b> · Forçada: <b>'+esc(attr(c,'dodge_forced')??'—')+'</b></p><p class="help">'+(c.dodge.bl>0?'Carga calculada: '+c.dodge.carried.toFixed(1)+' lb / BC '+c.dodge.bl.toFixed(1)+' lb → nível '+c.dodge.level+'.':'Sem Base de Carga calculável; usa o valor registrado na ficha.')+'</p></div>';
return '<div class="panel"><div class="title">'+esc(c.name)+' <small>'+esc(c.format)+' · '+esc(c.file)+'</small></div><div class="summary">'+Object.keys(labels).map(k=>'<div class="cell"><b>'+labels[k]+'</b><strong>'+esc(attr(c,k)??'—')+'</strong></div>').join('')+'</div>'+dodge+[['skills','📜 Perícias'],['spells','✨ Mágicas'],['advantages','🧬 Vantagens'],['disadvantages','📉 Desvantagens'],['peculiarities','⚠️ Peculiaridades']].map(([k,t])=>section(t,rows(c[k]),c[k].length)).join('')+section('🎒 Equipamentos',gear||'<p class="help">Nenhum registro.</p>',c.gear.length)+section('⚔️ Ataques',rows(c.attacks),c.attacks.length)+'</div>'}
function renderCompare(){if(!chars.length){$('comparison').innerHTML='<p class="help">Importe fichas para comparar.</p>';$('cmpCount').textContent='';return}$('cmpCount').textContent='('+chars.length+')';const q=$('query').value.toLowerCase().trim();
const sec=(title,rs,open=false)=>{const f=rs.filter(r=>!q||r.label.toLowerCase().includes(q));if(!f.length)return '';const head='<thead><tr><th>Registro</th>'+chars.map((c,i)=>'<th style="border-top:3px solid '+colors[i%colors.length]+'">'+esc(c.name||c.file)+'</th>').join('')+'</tr></thead>';const body=f.map(r=>'<tr><th>'+esc(r.label)+'</th>'+r.cells.map(x=>'<td>'+(Array.isArray(x)?x.length?x.map(y=>esc(y.value??'—')+(y.points!=null?' <small>['+esc(y.points)+' pts]</small>':'')+(y.weight?' <small>'+esc(y.weight)+'</small>':'')+(y.detail?' <small>'+esc(y.detail)+'</small>':'')).join('<br>'):'—':esc(x??'—'))+'</td>').join('')+'</tr>').join('');return section(title,'<table>'+head+'<tbody>'+body+'</tbody></table>',f.length,open||!!q)};
let html=sec('📊 Atributos e esquiva',[...Object.entries(labels),['dodge_auto','Esquiva (automático)'],['dodge_forced','Esquiva (forçada)']].map(([k,l])=>({label:l,cells:chars.map(c=>attr(c,k))})),true);
for(const[k,title]of[['skills','📜 Perícias'],['spells','✨ Mágicas'],['advantages','🧬 Vantagens'],['disadvantages','📉 Desvantagens'],['peculiarities','⚠️ Peculiaridades'],['gear','🎒 Equipamentos'],['attacks','⚔️ Ataques']]){const maps=chars.map(c=>{const m=new Map;for(const x of c[k]){const key=(x.name||'').toLowerCase();if(!m.has(key))m.set(key,{name:x.name,items:[]});m.get(key).items.push(x)}return m});const keys=new Set(maps.flatMap(m=>[...m.keys()]));html+=sec(title,[...keys].map(k=>({label:maps.find(m=>m.has(k)).get(k).name,cells:maps.map(m=>m.get(k)?.items||[])})).sort((a,b)=>a.label.localeCompare(b.label,'pt-BR')))}$('comparison').innerHTML=html}
function openStates(){return Array.from(document.querySelectorAll('#sheet details')).map(d=>d.open)}
function applyOpen(states){Array.from(document.querySelectorAll('#sheet details')).forEach((d,i)=>{if(states[i])d.open=true})}
function render(){const open=openStates();$('charbar').innerHTML=chars.map((c,i)=>'<button data-i="'+i+'" class="'+(i===active?'active':'')+'" style="border-left:3px solid '+colors[i%colors.length]+'">'+esc(c.name||c.file)+'</button>').join('')||'<span class="help">Nenhuma ficha carregada.</span>';$('sheet').innerHTML=chars[active]?renderSheet(chars[active]):'<div class="panel"><p class="help">Importe fichas GCS ou Singular para começar.</p></div>';applyOpen(open);renderCompare()}
$('import').onclick=()=>$('files').click();$('files').onchange=e=>importFiles(e.target.files);$('tabSheet').onclick=()=>{$('sheetView').hidden=false;$('compareView').hidden=true;$('tabSheet').classList.add('active');$('tabCompare').classList.remove('active')};$('tabCompare').onclick=()=>{$('sheetView').hidden=true;$('compareView').hidden=false;$('tabCompare').classList.add('active');$('tabSheet').classList.remove('active');renderCompare()};$('query').oninput=renderCompare;$('charbar').onclick=e=>{const b=e.target.closest('button');if(b){active=+b.dataset.i;render()}};
document.addEventListener('change',e=>{const load=e.target.dataset.load;if(load){const c=chars.find(c=>c.id===load);if(!c)return;c.state.dodgeOverride=e.target.value==='auto'?null:e.target.value;render();saveLocal();return}const eq=e.target.dataset.eq;if(eq){const c=chars.find(c=>c.id===eq),g=c?.gear[+e.target.dataset.i];if(!g)return;g.state=e.target.value;recalcDodge(c);render();saveLocal()}});
$('save').onclick=()=>download(JSON.stringify({formato:'plural-mesa',versao:17,fichas:serial()},null,2),'Plural-mesa.plural');$('theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light'};$('clear').onclick=()=>{if(confirm('Esvaziar a mesa?')){chars=[];active=0;render();saveLocal()}};window.addEventListener('dragover',e=>e.preventDefault());window.addEventListener('drop',e=>{e.preventDefault();importFiles(e.dataTransfer.files)});
async function boot(){try{db=await new Promise((res,rej)=>{const r=indexedDB.open('plural-local',1);r.onupgradeneeded=()=>r.result.createObjectStore('mesa');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});const saved=await new Promise((res,rej)=>{const r=db.transaction('mesa','readonly').objectStore('mesa').get('current');r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)});for(const x of saved){try{const c=parseSheet(x.raw??JSON.parse((x.original??'{}').replace(/^\uFEFF/,'')),x.file||'ficha.json',x.original,x.state||{});if(x.gear)for(const g of x.gear){const t=c.gear.find(y=>y.name===g.name);if(t)t.state=g.state}recalcDodge(c);chars.push(c)}catch(e){}}$('storage').textContent='Recuperação local ativa.'}catch(e){$('storage').textContent='Sem recuperação automática.'}render()}window.Plural={parseSheet,attr,importFiles,getCharacters:()=>chars};boot();
</script></html>
