function vit(c,k){const p=String(c.attrs[k]??'').split('/').map(x=>parseInt(x));let cur=Number.isNaN(p[0])?null:p[0],max=p.length>1?(Number.isNaN(p[1])?null:p[1]):cur;const ov=c.state[k+'Cur'];if(typeof ov==='number')cur=ov;if(cur==null&&max!=null)cur=max;return{cur,max}}
function vstat(k,cur,M){if(cur==null||!M)return{t:'Sem dados',e:[]};if(k==='hp'){if(cur<=-5*M)return{t:'Morto',e:['PV em −5×PV ou menos: morte automática.']};if(cur<=-M)return{t:'Morrendo',e:['Teste de morte (HT) ao cruzar cada múltiplo: −1×, −2×, −3×, −4×PV; em −5×PV é morte automática.','Teste de HT a cada turno para não cair inconsciente.','Movimento e Esquiva pela metade.']};if(cur<=0)return{t:'Em colapso (PV ≤ 0)',e:['Teste de HT a cada turno; falha = inconsciente.','Movimento e Esquiva pela metade.']};if(cur*3<M)return{t:'Abalado (< 1/3 PV)',e:['Movimento e Esquiva pela metade (arredondar para cima).']};return{t:cur>=M?'Saudável':'Ferido',e:[]}}

function addCond(c,x){const a=c.state.cond||[];if(!a.includes(x))c.state.cond=[...a,x]}
function addTest(c,t){c.state.tests=[...(c.state.tests||[]),t]}
function addLog(c,txt){c.state.log=[{t:Date.now(),txt},...(c.state.log||[])].slice(0,5)}
function setVal(c,k,nv){const v=vit(c,k),M=v.max,old=v.cur,m=[];if(M==null||old==null)return['Máximo desconhecido.'];if(k==='fp'){nv=Math.max(nv,-M);c.state.fpCur=nv;const below=Math.min(old,0)-Math.min(nv,0);if(below>0){const h=vit(c,'hp');m.push('PF abaixo de 0: '+below+' PV de dano automático.');m.push(...setVal(c,'hp',h.cur-below))}if(nv<=0&&old>0){addTest(c,{kind:'will',label:'Vontade para agir com PF ≤ 0',mod:0});m.push('PF em 0 ou menos: teste de Vontade antes de cada manobra (exceto Não Fazer Nada).')}else if(nv>0&&nv*3<M&&!(old*3<M))m.push('PF abaixo de 1/3: Movimento, Esquiva e ST pela metade.');if(nv<=-M){addCond(c,'Inconsciente (PF)');m.push('PF em −1×PF: inconsciente.')}if(nv>0&&old<=0)m.push('PF positivo novamente.');return m}
c.state.hpCur=nv;const lv=x=>x<=-M?Math.min(5,Math.floor(-x/M)):0;for(let i=lv(old)+1;i<=lv(nv);i++){if(i>=5){addCond(c,'Morto');m.push('PV em −5×PV: morte automática.')}else{addTest(c,{kind:'death',label:'Teste de morte (HT): cruzou −'+i+'×PV',mod:0});m.push('Cruzou −'+i+'×PV: role HT ou morre.')}}
if(nv<=0&&old>0){addTest(c,{kind:'conscious',label:'HT para ficar consciente (PV ≤ 0)',mod:0});m.push('PV em 0 ou menos: role HT a cada turno ou cai inconsciente; Movimento e Esquiva pela metade.')}else if(nv>0&&nv*3<M&&!(old*3<M))m.push('PV abaixo de 1/3: Movimento e Esquiva pela metade (arredondar para cima).');if(nv>0&&old<=0)m.push('PF positivo novamente.');return m}
function hit(c,dmg,id){const v=vit(c,'hp'),M=v.max,L=LOC[id],m=[];if(M==null||v.cur==null)return['Máximo de PV desconhecido.'];const major=dmg>M/2;m.push('Golpe de '+dmg+' em '+L.n+': '+(major?'FERIMENTO GRAVE (mais da metade do PV máximo).':'ferimento normal.'));m.push('Choque: −'+Math.min(4,dmg)+' em DX, IQ e perícias baseadas neles no próximo turno.');if(L.cr&&dmg>M/L.cr){addCond(c,'Aleijado: '+L.n);m.push(id==='eye'?'Olho aleijado (dano acima de PV/10).':L.n+' aleijado(a) (dano acima de PV/'+L.cr+').')}if(major){addTest(c,{kind:'ko',label:'HT contra queda e atordoamento'+(L.kd?' ('+L.kd+')':''),mod:L.kd});m.push('Role HT'+(L.kd?' '+L.kd:'')+': falha = atordoado e derrubado; falha por 5+ ou falha crítica = inconsciente.');if(['face','skull','eye'].includes(id))m.push('Ferimento grave na cabeça: a penalidade do local já está no teste. Atordoado, só pode Não Fazer Nada e rola HT todo turno para se recuperar.')}m.push(...setVal(c,'hp',v.cur-dmg));return m}
function rnd6s(n){const o=[],b=new Uint8Array(n*4);while(o.length<n){crypto.getRandomValues(b);for(const x of b)if(x<252&&o.length<n)o.push(x%6+1)}return o}
async function orgRoll(n){const ac=new AbortController(),t=setTimeout(()=>ac.abort(),6000);try{const r=await fetch('https://www.random.org/integers/?num='+n+'&min=1&max=6&col=1&base=10&format=plain&rnd=new',{signal:ac.signal,cache:'no-store'}),s=(await r.text()).trim();if(!r.ok||/^Error:/i.test(s))throw Error(s.split('\n')[0]||('HTTP '+r.status));const a=s.split(/\s+/).map(Number);if(a.length!==n||a.some(x=>!(x>=1&&x<=6)))throw Error('resposta inesperada');return a}finally{clearTimeout(t)}}
async function rollDice(n){if(useOrg){if(Date.now()<orgPause)return{a:rnd6s(n),src:'local (Random.org em pausa por 10 min após falha)'};try{return{a:await orgRoll(n),src:'Random.org'}}catch(e){orgPause=Date.now()+600000;return{a:rnd6s(n),src:'local (Random.org falhou: '+(e&&e.message||'erro')+')'}}}return{a:rnd6s(n),src:'local'}}
function parseDice(s){const m=String(s||'').trim().match(/^(\d+)d([+-]\d+)?$/i);if(!m)return null;const n=parseInt(m[1]);if(!(n>=1&&n<=20))return null;return{n,mod:m[2]?parseInt(m[2]):0}}
async function doRoll(c,i){const t=(c.state.tests||[])[i];if(!t||t.res)return;const ab=+(t.kind==='will'?c.attrs.will:c.attrs.ht);if(!Number.isFinite(ab)){vitMsg=['Atributo não encontrado na ficha.'];return}const R=await rollDice(3);if(!(c.state.tests||[])[i]||c.state.tests[i].res)return;const tgt=ab+(t.mod||0),d=R.a[0]+R.a[1]+R.a[2],ok=d<=4||(d<=tgt&&d<17),cf=!ok&&(d===18||(d===17&&tgt<=15)||d-tgt>=10),m=tgt-d,res='Rolou '+R.a.join('+')+' = '+d+' contra '+tgt+': '+(ok?'sucesso por '+m:'falha por '+(-m)+(cf?' (crítica)':''))+' ['+R.src+']';c.state.tests=c.state.tests.map((x,j)=>j===i?{...x,res}:x);vitMsg=[res];if(ok){vitMsg.push('Sem efeito adicional.');return}if(t.kind==='ko'){addCond(c,'Atordoado');addCond(c,'Caído');if(-m>=5||cf){addCond(c,'Inconsciente');vitMsg.push('Falha por 5+ ou crítica: inconsciente.')}else vitMsg.push('Atordoado e caído: só Não Fazer Nada; role HT no fim de cada turno para se recuperar.')}else if(t.kind==='conscious'){addCond(c,'Inconsciente');vitMsg.push('Caiu inconsciente.')}else if(t.kind==='death'){addCond(c,'Morto');vitMsg.push('Morreu.')}else if(t.kind==='will'){addCond(c,'Colapsado (PF)');vitMsg.push('Colapsou: incapacitado até PF positivo.'+(cf?' Falha crítica: role HT imediatamente; falhando, ataque cardíaco!':''))}}
function vitHtml(c){const k=vitK,v=vit(c,k),st=vstat(k,v.cur,v.max),nm=k==='hp'?'PV':'PF';let h='<b>'+nm+' — '+esc(c.name)+'</b><p style="font-size:22px;margin:6px 0"><b>'+(v.cur??'—')+' / '+(v.max??'—')+'</b></p><p class="help"><b>Estado: '+esc(st.t)+'</b>'+st.e.map(x=>'\n• '+esc(x)).join('')+'</p>';

$('vit').addEventListener('click',async e=>{const c=chars[active],b=e.target.closest('button');if(!c||!b)return;const d=b.dataset;if(d.vact==='close'){$('vit').close();return}pushU();vitMsg=[];const k=vitK;if(d.vd!==undefined){const v=vit(c,k),old=v.cur;vitMsg=setVal(c,k,(v.cur??0)+(+d.vd));addLog(c,(k==='hp'?'PV':'PF')+': '+old+' → '+((v.cur??0)+(+d.vd)))}else if(d.vact==='set'){const x=parseInt($('vset').value),v=vit(c,k),old=v.cur;if(Number.isNaN(x))vitMsg=['Digite um número.'];else{vitMsg=setVal(c,k,x);addLog(c,(k==='hp'?'PV':'PF')+': '+old+' → '+x)}}else if(d.vact==='full'){const v=vit(c,k),old=v.cur;if(v.max!=null){vitMsg=setVal(c,k,v.max);addLog(c,(k==='hp'?'PV':'PF')+': '+old+' → '+v.max+' (restaurado)')}}else if(d.vact==='hit'){const raw=$('vdmg').value.trim(),loc=$('vloc').value,dc=parseDice(raw);c.state.lastHit={raw,loc};if(dc){const R=await rollDice(dc.n),sum=R.a.reduce((a,b)=>a+b,0),dmg=sum+dc.mod;vitMsg=['Notação '+raw+' → '+R.a.join('+')+(dc.mod?(dc.mod>0?' + '+dc.mod:' − '+Math.abs(dc.mod)):'')+' = '+dmg+' ['+R.src+']'];vitMsg.push(...hit(c,dmg,loc));addLog(c,'Golpe: '+raw+' em '+LOC[loc].n+' → '+dmg+' PV')}else{const x=parseInt(raw);if(Number.isNaN(x)||x<0)vitMsg=['Digite o dano (número ≥ 0) ou notação como 3d-1.'];else{vitMsg=hit(c,x,loc);addLog(c,'Golpe: '+x+' em '+LOC[loc].n+' PV')}}}else if(d.vact==='repeat'){const lh=c.state.lastHit;if(!lh){vitMsg=['Nenhum golpe anterior.']}else{const dc=parseDice(lh.raw);if(dc){const R=await rollDice(dc.n),sum=R.a.reduce((a,b)=>a+b,0),dmg=sum+dc.mod;vitMsg=['Repetido '+lh.raw+' → '+R.a.join('+')+(dc.mod?(dc.mod>0?' + '+dc.mod:' − '+Math.abs(dc.mod)):'')+' = '+dmg+' ['+R.src+']'];vitMsg.push(...hit(c,dmg,lh.loc));addLog(c,'Golpe repetido: '+lh.raw+' em '+LOC[lh.loc].n+' → '+dmg+' PV')}else{const x=parseInt(lh.raw);vitMsg=hit(c,x,lh.loc);addLog(c,'Golpe repetido: '+x+' em '+LOC[lh.loc].n+' PV')}}}else if(d.vroll!==undefined){b.disabled=true;b.textContent='Rolando…';await doRoll(c,+d.vroll)}else if(d.vrm!==undefi function initState(){snapshot();const cp=curCamp();if(!cp.init)cp.init={round:1,cur:null,ret:null,manual:false,order:[],wait:[],off:[],tie:{}};return cp.init}
function initOrder(){const I=initState(),cs=chars.slice();for(const c of cs)if(I.tie[c.sid]==null)I.tie[c.sid]=rnd6s(3).reduce((a,b)=>a+b,0)+Math.random();const sp=c=>stat(c,'basic_speed')??-1,dx=c=>parseFloat(String(c.attrs.dx).replace(',','.'))||0;const auto=cs.sort((a,b)=>sp(b)-sp(a)||dx(b)-dx(a)||I.tie[b.sid]-I.tie[a.sid]);if(!I.manual)return auto;const by=new Map(chars.map(c=>[c.sid,c])),out=[];for(const s of I.order){if(by.has(s)){out.push(by.get(s));by.delete(s)}}for(const c of auto)if(by.has(c.sid))out.push(c);return out}
function initDown(c){const h=vit(c,'hp');return(h.cur!=null&&h.cur<=0)||ar(c.state.cond).some(x=>/Inconsciente|Morto|Atordoado|Colapsado/.test(x))}
function nextTurn(I,o){const base=I.ret!=null?I.ret:I.cur;I.ret=null;const s=o.findIndex(c=>c.sid===base);for(let k=1;k<=o.length;k++){const j=s+k,c=o[j%o.length];if(!I.off.includes(c.sid)){if(s>=0&&j>=o.length)I.round++;I.cur=c.sid;I.wait=I.wait.filter(x=>x!==c.sid);return}}}
function renderInit(){const el=$('initView');if(!el)return;if(!chars.length){el.innerHTML='<div class="panel"><p class="help">Importe fichas para organizar os turnos.</p></div>';return}const I=initState(),o=initOrder();const rowsH=o.map(c=>{const cur=I.cur===c.sid,w=I.wait.includes(c.sid),off=I.off.includes(c.sid),sp=stat(c,'basic_speed'),dx=c.attrs.dx;const flags=(cur?' ▶':'')+(w?' ⏳':'')+(off?' 🚫':'')+(initDown(c)?' ⚠️':'');const b=(a,t)=>'<button data-ini="'+a+'" data-s="'+c.sid+'" style="min-height:32px;padding:3px 7px">'+t+'</button>';return '<div class="row" style="'+(cur?'border-left:4px solid var(--gold);background:var(--accent);':'')+(off?'opacity:.5':'')+'"><span><b style="color:'+colors[chars.indexOf(c)%colors.length]+'">'+esc(c.name||c.file)+'</b>'+flags+'<br><small>Veloc '+esc(sp??'—')+' · DX '+esc(dx??'—')+(w?' · esperando':'')+(off?' · fora da ordem':'')+'</small></span><span style="display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:62%">'+b('up','▲')+b('down','▼')+(cur?b('wait','⏳ Esperar'):w?b('act','Agir'):'')+b('off',off?'✔':'🚫')+b('open','📄')+'</span></div>'}).join('');el.innerHTML='<div class="panel"><div class="title">⏱️ Turnos — Rodada '+I.round+'</div><div style="display:flex;gap:6px;flex-wrap:wrap;padding:8px"><button data-ini="next">Próximo turno ▶</button><button data-ini="auto">Ordem automática</button><button data-ini="roll">🎲 Desempate</button><button data-ini="reset">Zerar rodada</button></div><p class="help">Ordem: '+(I.manual?'manual (use ▲▼ para ajustar)':'automática (Veloc Bás › DX › desempate)')+(I.cur?'':'\nToque em Próximo turno para iniciar.')+'</p>'+rowsH+'</div>'}
$('initView').addEventListener('click',async e=>{const b=e.target.closest('[data-ini]');if(!b)return;const a=b.dataset.ini,sid=b.dataset.s;pushU();const I=initState(),o=initOrder();if(a==='next')nextTurn(I,o);else if(a==='wait'){if(I.cur&&!I.wait.includes(I.cur))I.wait.push(I.cur);nextTurn(I,o)}else if(a==='act'){if(I.ret==null)I.ret=I.cur;I.wait=I.wait.filter(x=>x!==sid);I.cur=sid}else if(a==='off'){I.off=I.off.includes(sid)?I.off.filter(x=>x!==sid):[...I.off,sid]}else if(a==='up'||a==='down'){const i=o.findIndex(c=>c.sid===sid),j=a==='up'?i-1:i+1;if(i>=0&&j>=0&&j<o.length){[o[i],o[j]]=[o[j],o[i]];I.order=o.map(c=>c.sid);I.manual=true}}else if(a==='auto'){I.manual=false;I.order=[]}else if(a==='reset'){I.round=1;I.wait=[];I.cur=null;I.ret=null;nextTurn(I,o)}else if(a==='roll'){const R=await rollDice(chars.length*3);I.tie={};chars.forEach((c,i)=>{I.tie[c.sid]=R.a[i*3]+R.a[i*3+1]+R.a[i*3+2]+Math.random()/100});$('notice').textContent='Desempate rolado ['+R.src+']'}else if(a==='open'){const i=chars.findIndex(c=>c.sid===sid);if(i>=0){active=i;showTab('Sheet');render();saveLocal();return}}saveLocal();renderInit()});
